services:
  db:
    image: mariadb:lts
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_DATABASE: ${POSTGRES_DB}
      MYSQL_USER: ${POSTGRES_USER}
      MYSQL_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./html:/var/www/html
    labels:      
      - traefik.http.routers.hasanakdeniz-web.rule=${DOMAIN}
      - traefik.http.routers.hasanakdeniz-web.entrypoints=websecure
      - traefik.http.routers.hasanakdeniz-web.tls=true
      - traefik.http.routers.hasanakdeniz-web.tls.certresolver=le

  sftp:
    image: atmoz/sftp
    restart: always
    ports:
      - "${SFTP_PORT}:22"
    # UID 33 (www-data) olarak ayarlandı, web sunucusu ile tam uyumlu
    command: "${SFTP_USER}:${SFTP_PASSWORD}:33"
    volumes:
      - ./html:/home/${SFTP_USER}/html

volumes:
  db_data: {}
