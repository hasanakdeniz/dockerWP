services:
  db:
    image: mariadb:lts
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    volumes:
      - ./html:/var/www/html
    labels:      
      - traefik.http.routers.hasanakdeniz-wp.rule=${DOMAIN}
      - traefik.http.routers.hasanakdeniz-wp.entrypoints=websecure
      - traefik.http.routers.hasanakdeniz-wp.tls=true
      - traefik.http.routers.hasanakdeniz-wp.tls.certresolver=le

  sftp:
    image: atmoz/sftp
    restart: always
    ports:
      - "${PORTS}:22"
    # UID 33 (www-data) olarak ayarlandı, yetki sorunu yaşatmaz.
    command: "${SFTP_USER}:${SFTP_PASSWORD}:33"
    volumes:
      - ./html:/home/${SFTP_USER}/html

volumes:
  db_data: {}
